<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIXUP BOOTH</title>
  <style>
    /* Reset dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: "Times New Roman", serif;
      background-color: #fff;
    }

    /* Kontainer utama di tengah layar */
    .center-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center; /* vertikal */
      align-items: center;     /* horizontal */
      text-align: center;
    }

    /* Judul utama */
    .logo-text {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 2px;
      color: black;
      margin-bottom: 40px;
    }

    /* Tombol Start */
    .start-btn {
      font-size: 28px;
      font-family: "Times New Roman", serif;
      padding: 10px 50px;
      border: 3px solid black;
      background-color: white;
      color: black;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .start-btn:hover {
      background-color: black;
      color: white;
    }

    /* Responsif untuk HP */
    @media (max-width: 600px) {
      .logo-text {
        font-size: 40px;
        margin-bottom: 25px;
      }
      .start-btn {
        font-size: 22px;
        padding: 8px 36px;
      }
    }
  </style>
</head>
<body>
  <div class="center-wrapper">
    <h1 class="logo-text">PIXUP BOOTH</h1>
    <button class="start-btn" onclick="startPhotobooth()">Start</button>
  </div>

  <script>
    function startPhotobooth() {
      // Ganti nanti ke halaman berikutnya (misalnya select-frame.html)
      window.location.href = "select-frame.html";
    }
  </script>
</body>
</html>
